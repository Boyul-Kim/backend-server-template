# Runs the production image locally. Copy .env.example to .env and fill in
# the production values first (APP_URL, CORS_ORIGINS, PB_ENCRYPTION_KEY, ...).
services:
  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    env_file: .env
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8090
      PB_DATA_DIR: /pb_data
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb_data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp # multipart uploads spill to os.TempDir
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s

volumes:
  pb_data:
